<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 회화 & 단어 마스터 스튜디오</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans KR', 'Noto Sans JP', sans-serif;
            background-color: #fdf8f6;
            touch-action: manipulation;
        }
        .font-jua {
            font-family: 'Jua', sans-serif;
        }
        /* 3D Card flip styles */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .card-flipped {
            transform: rotateY(180deg);
        }
        
        /* Shake animation for wrong matching */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .wrong-shake {
            animation: shake 0.4s ease-in-out !important;
            background-color: #ffe4e6 !important;
            border-color: #f43f5e !important;
        }
        .pulse-ring {
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse-ring-anim 1.5s infinite;
        }
        @keyframes pulse-ring-anim {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        canvas {
            touch-action: none;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col select-none pb-12">

    <!-- Header -->
    <header class="bg-amber-400 border-b-4 border-amber-500 sticky top-0 z-30 shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center gap-2 cursor-pointer" onclick="switchAppTab('app-words')">
                <i class="fa-solid fa-comments text-2xl text-pink-600"></i>
                <h1 class="font-jua text-2xl text-slate-900 tracking-wide">일본어 통합 학습 스튜디오</h1>
            </div>

            <div class="flex items-center gap-2 flex-wrap">
                <button onclick="openShareModal()" class="bg-pink-500 hover:bg-pink-600 text-white px-3 py-1.5 rounded-xl font-jua text-sm shadow transition active:scale-95 flex items-center gap-1">
                    <i class="fa-solid fa-share-nodes"></i>
                    <span>결과 공유</span>
                </button>
                <button onclick="openTeacherAuthModal()" class="bg-slate-800 hover:bg-slate-900 text-amber-300 px-3 py-1.5 rounded-xl font-jua text-sm shadow transition active:scale-95 flex items-center gap-1">
                    <i class="fa-solid fa-lock"></i>
                    <span>선생님 공간</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Navigation: App 1 vs App 2 -->
    <div class="bg-amber-100 border-b border-amber-200">
        <div class="max-w-5xl mx-auto px-4 py-2 flex gap-2">
            <button id="main-nav-words" onclick="switchAppTab('app-words')" class="flex-1 py-3 px-4 rounded-2xl font-jua text-lg shadow transition bg-pink-500 text-white flex items-center justify-center gap-2">
                <i class="fa-solid fa-book-open"></i>
                <span>1. 단어/기본문장 연습</span>
            </button>
            <button id="main-nav-conversation" onclick="switchAppTab('app-conversation')" class="flex-1 py-3 px-4 rounded-2xl font-jua text-lg shadow transition bg-white text-slate-700 hover:bg-slate-50 flex items-center justify-center gap-2">
                <i class="fa-solid fa-headset"></i>
                <span>2. 실전회화 & AI 말하기</span>
            </button>
        </div>
    </div>

    <!-- ================================================================= -->
    <!-- APP SECTION 1: WORD / SHORT SENTENCE APP                          -->
    <!-- ================================================================= -->
    <main id="app-words" class="app-section max-w-5xl mx-auto w-full px-4 py-6 flex-grow flex flex-col">

        <!-- Global Category Selector Header -->
        <div class="w-full bg-white border-2 border-amber-300 rounded-2xl p-3 mb-6 shadow-sm flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-layer-group text-amber-500 text-lg"></i>
                <span class="font-jua text-slate-700 text-base">학습 카테고리 선택:</span>
                <select id="global-category-filter" onchange="onGlobalCategoryChange(this.value)" class="font-jua text-base text-pink-600 outline-none bg-amber-50 px-3 py-1 rounded-xl border border-amber-300 cursor-pointer">
                    <option value="ALL">전체 카테고리</option>
                </select>
            </div>
            <button id="fc-filter-review-btn" onclick="toggleReviewOnlyMode()" class="px-3 py-1.5 rounded-xl border border-pink-300 bg-pink-50 text-pink-600 font-jua text-sm hover:bg-pink-100 transition">
                <i class="fa-solid fa-filter me-1"></i> 복습 모드 (모르는 단어만)
            </button>
        </div>

        <!-- Stage Nav -->
        <nav class="grid grid-cols-3 gap-2 mb-6">
            <button id="tab-btn-flashcards" onclick="switchWordTab('flashcards')"
